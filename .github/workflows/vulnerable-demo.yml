name: DEMO INSEGURO - No copiar este patrón

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  vulnerable:
    if: startsWith(github.event.issue.title, 'PWN')
    runs-on: ubuntu-latest
    steps:
      - name: Interpolación directa (INSEGURO)
        uses: actions/github-script@v9
        with:
          script: |
            const title = "${{ github.event.issue.title }}"
            console.log('Titulo recibido:', title)
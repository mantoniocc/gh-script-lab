name: Issue Triage Bot

on:
    issues: 
        types: [opened]

permissions: 
    contents: read
    issues: write

jobs:
    welcome:
        runs-on: ubuntu-latest
        steps:
            - name: Comment on new issue
              uses: actions/github-script@v9
              if: ${{github.event.issue.author_association != github.repository_owner}}
              with:
                script: |
                    const {owner, repo, number } = context.issue
                    const author = context.payload.issue.user.login
                    
                    console.log(`Comentando en ${owner}/${repo}#${number} (author: ${author})`)

                    await github.rest.issues.createComment({
                        owner,
                        repo,
                        issue_number: number,
                        body: [
                            `👋 Gracias por abrir esta issue, @${author}!`,
                            '',
                            'Un mantenedor la revisará pronto. Mientras tanto, verifica que hayas incluido:',
                            '',
                            '- Pasos para reproducir',
                            '- Comportamiento esperado vs. observado',
                            '- Versión y sistema operativo',
                            '',
                            `<sub>🤖 Automatizado — run [#${context.runNumber}](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})</sub>`
                        ].join('\n')
                    })
            
            
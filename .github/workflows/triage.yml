name: Issue Triage Bot

on:
    issues: 
        types: [opened]

permissions: 
    contents: read
    issues: write

jobs:
    welcome:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout responde template
              uses: actions/checkout@v6
              with:
                sparse-checkout: .github/ISSUE_RESPONSES
            - name: Comment on new issue
              uses: actions/github-script@v9
              if: github.event.issue.author_association != 'OWNER'
              with:
                script: |
                    const fs = require('fs')

                    const {owner, repo, number } = context.issue
                    const author = context.payload.issue.user.login
                    const repoUrl = `${context.serverUrl}/${owner}/${repo}`

                    console.log('cwd = ', process.cwd())
                    console.log('contenido =', fs.readdirSync('.'))

                    const template = fs.readFileSync('.github/ISSUE_RESPONSES/welcome.md', 'utf8')

                    const body = template
                        .replaceAll('{{author}}', author)
                        .replaceAll('{{repoUrl}}', repoUrl)
                        .replaceAll('{{runNumber}}', String(context.runNumber))
                        .replaceAll('{{runUrl}}', `${repoUrl}/actions/runs/${context.runId}`)

                    await github.rest.issues.createComment({
                        owner,
                        repo,
                        issue_number: number,
                        body
                    })

            - name: Auto-label by content
              uses: actions/github-script@v9
              env:
                ISSUE_TITLE: ${{github.event.issue.title}}
                ISSUE_BODY: ${{github.event.issue.body}}
              with:
                script: |
                    const title = process.env.ISSUE_TITLE || ''
                    const body = process.env.ISSUE_BODY || ''
                    const text = `${title}\n${body}`.toLowerCase()

                     const rules = [
                        { label: 'bug',         patterns: ['error', 'crash', 'crashea', 'falla', 'no funciona', 'bug'] },
                        { label: 'enhancement', patterns: ['feature', 'sugerencia', 'seria bueno', 'propuesta', 'mejora'] },
                        { label: 'question',    patterns: ['como puedo', 'duda', 'pregunta', '?'] },
                        { label: 'documentation', patterns: ['docs', 'documentacion', 'readme', 'typo'] }
                    ]
                    
                    const matched = rules
                        .filter(r => r.patterns.some(p => text.includes(p)))
                        .map(r => r.label)

                    const labels = matched.length ? matched : ['need-triage']

                    core.info(`Texto analizado: ${text.length} caracteres`)
                    core.info(`Labels a aplicar: ${labels.join(', ')}`)

                    await github.rest.issues.addLabels({
                        ...context.repo,
                        issue_number: context.issue.number,
                        labels
                    })

                    await core.summary
                        .addHeading('Triage automatico', 3)
                        .addList(labels)
                        .write()
            
            
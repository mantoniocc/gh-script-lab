name: Issue Triage Bot

on:
    issues: 
        types: [opened]

permissions: 
    contents: read
    issues: write

jobs:
    welcome:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout responde template
              uses: actions/checkout@v6
              with:
                sparse-checkout: |
                    .github/ISSUE_RESPONSES
                    .github/scripts
                
            - name: Comment on new issue
              uses: actions/github-script@v9
              if: github.event.issue.author_association != 'OWNER'
              with:
                script: |
                    const fs = require('fs')

                    const {owner, repo, number } = context.issue
                    const author = context.payload.issue.user.login
                    const repoUrl = `${context.serverUrl}/${owner}/${repo}`

                    console.log('cwd = ', process.cwd())
                    console.log('contenido =', fs.readdirSync('.'))

                    const template = fs.readFileSync('.github/ISSUE_RESPONSES/welcome.md', 'utf8')

                    const body = template
                        .replaceAll('{{author}}', author)
                        .replaceAll('{{repoUrl}}', repoUrl)
                        .replaceAll('{{runNumber}}', String(context.runNumber))
                        .replaceAll('{{runUrl}}', `${repoUrl}/actions/runs/${context.runId}`)

                    await github.rest.issues.createComment({
                        owner,
                        repo,
                        issue_number: number,
                        body
                    })

            - name: Auto-label by content
              id: classify
              uses: actions/github-script@v9
              env:
                ISSUE_TITLE: ${{github.event.issue.title}}
                ISSUE_BODY: ${{github.event.issue.body}}
              with:
                script: |
                    const classify = require('.github/scripts/classify.js')
                    return await classify({github, context, core})

            - name: Report triage result
              uses: actions/github-script@v9
              env:
                TRIAGE_RESULT: ${{steps.classify.outputs.result}}
              with:
                script: |
                    const {label, priority} = JSON.parse(process.env.TRIAGE_RESULT)

                    core.notice(`Issue clasificada: ${label} / ${priority}`)

                    await core.summary
                        .addHeading('Triage automático', 3)
                        .addTable([
                            [{ data: 'Campo', header: true }, { data: 'Valor', header: true }],
                            ['Label', label],
                            ['Prioridad', priority],
                            ['Issue', `#${context.issue.number}`]
                        ])
                        .write()
            
            